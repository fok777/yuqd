name: Heartbeat

# 高频心跳：每 2 小时一次，是对 MT 仓库 Verify（cron: '3 */2 * * *'）的照搬
# 作用：① 强制重新启用被闲置禁用的 workflow ② 产生真实内容提交保活
on:
  schedule:
    - cron: '17 */2 * * *'   # 每 2 小时的第 17 分（避开整点高峰）
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 不指定 token => 使用 GITHUB_TOKEN（MT 仓库同款，永不过期）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 自愈核心：把本仓库所有被闲置禁用的 workflow 重新启用
      # MT 仓库 checkin.yml 里的"Check permissions"就是这一步，是它从不断的真正原因
      - name: 强制启用所有被禁用的Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows" \
            --jq '.workflows[] | "\(.id)\t\(.state)\t\(.name)"' | while IFS=$'\t' read -r id state name; do
            [ -z "$id" ] && continue
            if [ "$state" != "active" ]; then
              gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/enable" >/dev/null 2>&1 \
                && echo "✅ 已重新启用: $name" || echo "⚠️ 启用失败: $name"
            fi
          done
          exit 0

      # 真实内容提交（非空提交）—— GitHub 判定仓库活动只认真提交
      - name: 写入心跳时间戳
        run: |
          mkdir -p .heartbeat
          TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST' > .heartbeat/last.txt
          echo "run_id=${GITHUB_RUN_ID}" >> .heartbeat/last.txt
          cat .heartbeat/last.txt

      - name: 提交心跳
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .heartbeat/last.txt
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"; exit 0
          fi
          git commit -m "chore: heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
          exit 0

      - name: 清理旧运行记录（每个workflow保留最近6次）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --jq '.workflows[].id' | while read -r wf; do
            [ -z "$wf" ] && continue
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=100&status=completed" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[6:] | .[].id' | while read -r rid; do
              [ -z "$rid" ] && continue
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$rid" >/dev/null 2>&1 && echo "已删run $rid"
            done
          done
          exit 0
